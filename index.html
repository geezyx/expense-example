<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Receipt Upload</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
        }
        h2 { margin-top: 0; color: #111827; text-align: center; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; color: #374151; }
        input, textarea { padding: 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem; }
        input:focus, textarea:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        
        .camera-box {
            background-color: #f9fafb;
            border: 2px dashed #d1d5db;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            position: relative;
            margin: 20px 0;
            cursor: pointer;
        }
        .camera-box input[type="file"] {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer;
        }
        
        .btn {
            background-color: #2563eb;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            width: 100%;
            cursor: pointer;
        }
        .btn:disabled { background-color: #9ca3af; cursor: not-allowed; }
        
        #msg {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            display: none;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Submit Receipt</h2>
    <form id="receiptForm">
        <div class="form-group">
            <label for="name">Your Name</label>
            <input type="text" id="name" required>
        </div>
        
        <div class="form-group">
            <label for="date">Expense Date</label>
            <input type="date" id="date" required>
        </div>
        
        <div class="form-group">
            <label for="description">Description / Vendor</label>
            <textarea id="description" rows="2" placeholder="e.g., Target - Office Supplies" required></textarea>
        </div>

        <div class="camera-box">
            <span id="fileLabel">📸 Tap to take photo of receipt</span>
            <input type="file" id="receiptFile" accept="image/*" capture="environment" required>
        </div>

        <div id="msg"></div>
        <button type="submit" class="btn" id="submitBtn">Send to Google Drive</button>
    </form>
</div>

<script>
    // ⚠️ PASTE YOUR GOOGLE APPS SCRIPT WEB APP DEPLOYMENT URL HERE
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyQ5274y2MYWq28nk5VrTZQBRo1Q_3W9VEAQuak4ZmGQRYUkQsedg1PfMdXjFC36mnS/exec";

    // Autofill today's date
    document.getElementById('date').value = new Date().toISOString().split('T')[0];
    
    let fileDataObj = null;

    // Handle Mobile Photo Capture
    document.getElementById('receiptFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        document.getElementById('fileLabel').textContent = "⏳ Reading image...";
        const reader = new FileReader();
        reader.onloadend = function() {
            fileDataObj = {
                base64Str: reader.result.split(',')[1],
                type: file.type,
                name: file.name
            };
            document.getElementById('fileLabel').textContent = `✅ Ready: ${file.name.substring(0, 15)}...`;
        };
        reader.readAsDataURL(file);
    });

    // Handle Submit
    document.getElementById('receiptForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const msg = document.getElementById('msg');
        
        btn.disabled = true;
        msg.style.display = 'block';
        msg.style.backgroundColor = '#f3f4f6';
        msg.style.color = '#1f2937';
        msg.textContent = "⏳ Uploading to Google Drive...";

        const payload = {
            name: document.getElementById('name').value,
            date: document.getElementById('date').value,
            description: document.getElementById('description').value,
            receiptFile: fileDataObj
        };

        try {
            await fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(payload)
            });

            msg.style.backgroundColor = '#dcfce7';
            msg.style.color = '#16a34a';
            msg.textContent = "🎉 Successfully uploaded!";
            document.getElementById('receiptForm').reset();
            document.getElementById('date').value = new Date().toISOString().split('T')[0];
            document.getElementById('fileLabel').textContent = "📸 Tap to take photo of receipt";
            fileDataObj = null;
        } catch (err) {
            msg.style.backgroundColor = '#fee2e2';
            msg.style.color = '#dc2626';
            msg.textContent = "❌ Upload failed. Please try again.";
            console.error(err);
        } finally {
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
